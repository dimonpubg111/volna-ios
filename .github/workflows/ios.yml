name: VOLNA native iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native app and run simulator tests
        run: bash scripts/ci.sh

      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VOLNA-iPhone-native
          path: |
            build/*.zip
            build/*.ipa
            build/*.xcresult
          retention-days: 3
          if-no-files-found: warn
